<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验大厅 - 星朴XP-AI001人工智能算法训练平台</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* ===== P2 LabHall 布局 — navy/cyan 深色主题 ===== */

        .lab-root {
            padding-bottom: var(--space-5);
        }

        /* --- Hero 标题+统计行 --- */
        .lab-hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: var(--space-4);
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--border-light);
            margin-bottom: var(--space-5);
            flex-wrap: wrap;
        }

        .lab-hero-left {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .lab-hero-title-row {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .lab-hero-icon-badge {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-base);
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .lab-hero-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--text-title);
        }

        .lab-hero-subtitle {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }

        .lab-stats-widget {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-3) var(--space-4);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-3) var(--space-5);
            font-size: var(--font-size-xs);
        }

        .lab-stats-widget .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lab-stats-widget .stat-item .stat-label {
            color: var(--text-secondary);
        }

        .lab-stats-widget .stat-item .stat-value {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            color: var(--primary-green);
        }

        .lab-stats-widget .stat-divider {
            width: 1px;
            height: 16px;
            background: var(--border-light);
        }

        /* --- 筛选搜索面板 --- */
        .lab-filter-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .filter-row {
            display: flex;
            align-items: flex-start;
            gap: var(--space-3);
        }

        .filter-row .filter-label {
            width: 60px;
            flex-shrink: 0;
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            color: var(--text-secondary);
            letter-spacing: 1px;
            padding-top: 5px;
        }

        .filter-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            padding: 5px 14px;
            border-radius: var(--radius-base);
            border: 1px solid var(--border-light);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
            color: var(--text-body);
            background: var(--bg-panel);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-family);
        }

        .filter-btn:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        .filter-btn.active {
            background: rgba(0, 212, 170, 0.1);
            border-color: rgba(0, 212, 170, 0.3);
            color: var(--primary-green);
            font-weight: var(--font-weight-semibold);
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding-top: var(--space-3);
            border-top: 1px solid var(--border-light);
        }

        .search-input-wrap {
            flex: 1;
            position: relative;
        }

        .search-input-wrap .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .search-input-wrap input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-base);
            padding: 8px 12px 8px 32px;
            font-size: var(--font-size-xs);
            color: var(--text-body);
            outline: none;
            transition: border-color 0.2s ease;
            font-family: var(--font-family);
        }

        .search-input-wrap input:focus {
            border-color: var(--primary-green);
        }

        .search-input-wrap input::placeholder {
            color: var(--text-secondary);
        }

        .btn-query, .btn-reset {
            padding: 8px 20px;
            border-radius: var(--radius-base);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-family);
            border: none;
        }

        .btn-query {
            background: var(--primary-green);
            color: #0f0f23;
        }

        .btn-query:hover {
            opacity: 0.85;
        }

        .btn-reset {
            background: var(--bg-input);
            color: var(--text-body);
            border: 1px solid var(--border-light);
        }

        .btn-reset:hover {
            border-color: var(--text-secondary);
        }

        /* --- 排序标签栏 --- */
        .sort-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: var(--space-2);
            margin-bottom: var(--space-4);
            font-size: var(--font-size-xs);
        }

        .sort-bar-left {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        .sort-bar-left .sort-label {
            color: var(--text-secondary);
            font-weight: var(--font-weight-semibold);
            letter-spacing: 1px;
        }

        .sort-tabs {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .sort-tab {
            position: relative;
            padding: 4px 0;
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s ease;
            background: none;
            border: none;
            font-family: var(--font-family);
        }

        .sort-tab:hover {
            color: var(--primary-green);
        }

        .sort-tab.active {
            color: var(--primary-green);
        }

        .sort-tab.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-green);
        }

        .sort-bar-right {
            color: var(--text-secondary);
        }

        .sort-bar-right .sort-count {
            color: var(--text-title);
            font-weight: var(--font-weight-bold);
        }

        /* --- 主网格布局 --- */
        .lab-main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-5);
        }

        .lab-main-grid.with-sidebar {
            grid-template-columns: 2fr 1fr;
        }

        /* --- 实验环境卡片网格 --- */
        .lab-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-4);
        }

        .lab-main-grid.with-sidebar .lab-card-grid {
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }

        /* --- 实验环境卡片 --- */
        .lab-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 400px;
        }

        .lab-card:hover {
            border-color: var(--primary-green);
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.08);
            transform: translateY(-2px);
        }

        .lab-card.selected {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 2px rgba(0, 212, 170, 0.3);
        }

        .lab-card-cover {
            height: 130px;
            background: linear-gradient(135deg, var(--bg-panel), var(--bg-body));
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .lab-card-cover .cover-icon {
            font-size: 40px;
            opacity: 0.6;
        }

        .lab-card-cover .cover-grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 168, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 168, 255, 0.03) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .lab-card-cover .cover-glow {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 212, 170, 0.06);
            filter: blur(20px);
        }

        .lab-card-cover .type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 212, 170, 0.1);
            color: var(--primary-green);
            border: 1px solid rgba(0, 212, 170, 0.2);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-size: 10px;
            font-weight: var(--font-weight-bold);
        }

        .lab-card-cover .boot-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 15, 35, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .lab-card-cover .boot-overlay .boot-progress {
            width: 80%;
            height: 3px;
            background: var(--bg-input);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .lab-card-cover .boot-overlay .boot-progress-fill {
            height: 100%;
            background: var(--primary-green);
            transition: width 0.3s ease;
        }

        .lab-card-cover .boot-overlay .boot-text {
            font-size: 10px;
            color: var(--primary-green);
            font-weight: var(--font-weight-bold);
        }

        .lab-card-cover .running-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 212, 170, 0.9);
            color: #0f0f23;
            font-size: 10px;
            font-weight: var(--font-weight-semibold);
            text-align: center;
            padding: 3px 0;
        }

        .lab-card-body {
            padding: var(--space-3);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: var(--space-2);
        }

        .lab-card-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-1);
        }

        .lab-card-name {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            color: var(--text-title);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lab-card:hover .lab-card-name {
            color: var(--primary-green);
        }

        .lab-card-available {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: var(--font-weight-semibold);
            color: var(--primary-green);
            background: rgba(0, 212, 170, 0.08);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .lab-card-available .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-green);
        }

        .lab-card-desc {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 33px;
        }

        .lab-card-tags {
            border-top: 1px solid var(--border-light);
            padding-top: var(--space-2);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .lab-card-course-tag {
            background: rgba(0, 212, 170, 0.08);
            color: var(--primary-green);
            font-size: 10px;
            font-weight: var(--font-weight-semibold);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .lab-card-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            font-size: 10px;
            color: var(--text-secondary);
        }

        .lab-card-stats .stat-cell {
            display: flex;
            align-items: center;
            gap: 3px;
            overflow: hidden;
        }

        .lab-card-stats .stat-cell span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lab-card-footer {
            padding: 0 var(--space-3) var(--space-3);
        }

        .lab-card-experience-btn {
            width: 100%;
            padding: 7px 0;
            background: transparent;
            border: 1px solid rgba(0, 212, 170, 0.2);
            color: var(--primary-green);
            border-radius: var(--radius-base);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-family: var(--font-family);
        }

        .lab-card:hover .lab-card-experience-btn {
            background: var(--primary-green);
            color: #0f0f23;
            border-color: var(--primary-green);
        }

        /* --- 空状态 --- */
        .lab-empty {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            text-align: center;
        }

        .lab-empty .empty-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 212, 170, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-3);
            font-size: 24px;
        }

        .lab-empty h4 {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--text-title);
            margin-bottom: var(--space-1);
        }

        .lab-empty p {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            margin-bottom: var(--space-3);
        }

        .lab-empty .btn-clear-filters {
            padding: 7px 20px;
            background: var(--primary-green);
            color: #0f0f23;
            border: none;
            border-radius: var(--radius-base);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            font-family: var(--font-family);
        }

        /* --- 详情抽屉（右侧 sidebar） --- */
        .lab-details-sidebar {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            position: sticky;
            top: 80px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--border-light);
            margin-bottom: var(--space-3);
        }

        .sidebar-header .sidebar-type {
            display: inline-block;
            font-size: 10px;
            background: rgba(0, 212, 170, 0.1);
            color: var(--primary-green);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-weight: var(--font-weight-semibold);
            margin-bottom: 4px;
        }

        .sidebar-header .sidebar-name {
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-bold);
            color: var(--text-title);
        }

        .sidebar-close {
            background: var(--bg-input);
            border: none;
            color: var(--text-secondary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .sidebar-close:hover {
            color: var(--text-title);
            background: var(--bg-panel);
        }

        .sidebar-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-2) 0;
            border-bottom: 1px solid rgba(61, 61, 92, 0.3);
            font-size: var(--font-size-xs);
        }

        .sidebar-info-row .info-label {
            color: var(--text-secondary);
        }

        .sidebar-info-row .info-value {
            font-weight: var(--font-weight-semibold);
            color: var(--text-body);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sidebar-info-row .info-value.green {
            color: var(--primary-green);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .status-dot.green { background: var(--primary-green); }
        .status-dot.amber { background: rgba(245, 158, 11, 0.9); }
        .status-dot.gray { background: var(--text-secondary); }

        .sidebar-specialties {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 180px;
        }

        .sidebar-specialty-tag {
            background: var(--bg-input);
            color: var(--text-body);
            border: 1px solid var(--border-light);
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-size: 10px;
            font-weight: var(--font-weight-medium);
        }

        .sidebar-intro {
            padding-top: var(--space-2);
        }

        .sidebar-intro-label {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            padding-bottom: 4px;
        }

        .sidebar-intro-text {
            font-size: var(--font-size-xs);
            color: var(--text-body);
            line-height: 1.6;
            background: var(--bg-panel);
            padding: var(--space-2);
            border-radius: var(--radius-base);
            border: 1px solid var(--border-light);
        }

        .sidebar-courses-section {
            padding-top: var(--space-2);
        }

        .sidebar-courses-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-semibold);
            color: var(--text-title);
            padding: var(--space-1) 0;
        }

        .sidebar-courses-header:hover {
            color: var(--primary-green);
        }

        .sidebar-courses-list {
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-base);
            padding: var(--space-2);
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-course-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--text-body);
        }

        .sidebar-course-item .course-num {
            width: 16px;
            height: 16px;
            background: rgba(0, 212, 170, 0.1);
            color: var(--primary-green);
            font-size: 9px;
            font-weight: var(--font-weight-bold);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-course-item .course-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-controls {
            padding-top: var(--space-3);
            border-top: 1px solid var(--border-light);
        }

        .btn-launch {
            width: 100%;
            padding: 10px 0;
            background: var(--primary-green);
            color: #0f0f23;
            border: none;
            border-radius: var(--radius-base);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: var(--font-family);
        }

        .btn-launch:hover {
            opacity: 0.85;
        }

        .btn-launch:disabled {
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .btn-console {
            flex: 1;
            padding: 8px 0;
            background: var(--primary-green);
            color: #0f0f23;
            border: none;
            border-radius: var(--radius-base);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-family: var(--font-family);
        }

        .btn-power {
            padding: 8px 12px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-base);
            font-size: var(--font-size-xs);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-family);
        }

        .btn-power:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .boot-console-mini {
            background: #0d0d1a;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-base);
            padding: var(--space-2);
            height: 70px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            line-height: 1.5;
        }

        .boot-console-mini .log-line {
            color: var(--text-secondary);
        }

        .boot-console-mini .log-line .log-prefix {

                coursesCount: 5, viewsCount: 1050, durationStr: "340 分钟", durationMinutes: 340,

        /* ===== 筛选选项 ===== */
        var CATEGORIES = ["全部", "平台型", "组合型", "容器型", "虚拟系统"];

        var SORT_OPTIONS = ["默认排序", "最多课程", "最多浏览", "使用最多"];

        /* ===== 实验环境跳转路由（映射到已有的仿真/开发环境页面） ===== */
        var LAB_ENV_ROUTES = {
            "engineering-simulation": "engineering-simulation.html",
            "3d-designer": "3d-designer-enhanced.html",

            "industry-dashboard": "industry-cloud.html",

            "jupyter-notebook": "jupyter-lab.html",

        };

        function getLabRoute(labId) {
            return LAB_ENV_ROUTES[labId] || null;
        }

        /* ===== 进入实验环境 ===== */
        function openLabEnvironment(labId) {
            var route = getLabRoute(labId);
            if (route) {
                window.location.href = route;
                return true;
            }
            var lab = LAB_ENVIRONMENTS.find(function(l){ return l.id === labId; });
            showToast((lab ? lab.name : '该实验') + ' 控制台已打开（原型演示模式）。');
            return false;
        }

        /* ===== 固定统计 ===== */
        var TOTAL_COUNT = LAB_ENVIRONMENTS.length;
        var PLATFORM_TYPE_COUNT = LAB_ENVIRONMENTS.filter(function(l){ return l.type === "平台型"; }).length;
        var COMPOSITE_TYPE_COUNT = LAB_ENVIRONMENTS.filter(function(l){ return l.type === "组合型"; }).length;

        var TOTAL_MATCHED_COURSES = LAB_ENVIRONMENTS.reduce(function(sum, l){ return sum + l.coursesCount; }, 0);

        /* ===== 状态 ===== */
        var state = {
            view: 'list',
            selectedLabId: null,
            detailsLabId: null,
            filterCategory: '全部',
            filterSpecialty: '全部',
            filterSubCategory: '全部',

            bootStates: {},
            toast: null,
            toastTimer: null,
            coursesListCollapsed: false
        };

        /* ===== Toast ===== */
        function showToast(msg) {
            state.toast = msg;
            if (state.toastTimer) clearTimeout(state.toastTimer);
            state.toastTimer = setTimeout(function() { state.toast = null; renderToast(); }, 3000);
            renderToast();
        }

        function renderToast() {
            var existing = document.getElementById('labToastEl');
            if (existing) existing.remove();
            if (!state.toast) return;
            var el = document.createElement('div');
            el.id = 'labToastEl';
            el.className = 'lab-toast';
            el.innerHTML = '<span>✓</span><span>' + state.toast + '</span>';
            document.body.appendChild(el);
        }

        /* ===== 课程详情辅助 ===== */
        function getCourseDetails(courseName, index) {
            var types = ["岗位课程", "专业技术技能", "课程实训", "综合项目"];
            var type = types[index % types.length];
            var matchPercent = 95 + ((index * 2 + courseName.length) % 5);
            var enrolledCount = 180 + ((index * 53 + courseName.length * 7) % 320);
            var hours = 24 + ((index * 8 + courseName.length * 4) % 40);
            var levels = ["初级", "中级", "高级"];
            var level = levels[(index + courseName.length) % levels.length];
            return { name: courseName, type: type, matchDegree: matchPercent + '%', enrolledCount: enrolledCount + '人', suggestedHours: hours + '学时', difficulty: level };
        }

        /* ===== 筛选+排序 ===== */
        function getFilteredAndSortedLabs() {
            var result = LAB_ENVIRONMENTS.filter(function(lab) {
                if (state.filterCategory !== '全部') {
                    if (state.filterCategory === '虚拟系统') { if (!lab.isVirtualSystem) return false; }
                    else { if (lab.type !== state.filterCategory) return false; }
                }
                if (state.filterSpecialty !== '全部') { if (lab.specialties.indexOf(state.filterSpecialty) === -1) return false; }
                if (state.filterSubCategory !== '全部') { if (lab.subCategory !== state.filterSubCategory) return false; }
                if (state.searchQuery.trim() !== '') {
                    var q = state.searchQuery.toLowerCase();
                    var matchName = lab.name.toLowerCase().indexOf(q) !== -1;
                    var matchDesc = lab.desc.toLowerCase().indexOf(q) !== -1;
                    var matchSpec = lab.specialties.some(function(s){ return s.toLowerCase().indexOf(q) !== -1; });
                    var matchCourse = lab.courseList.some(function(c){ return c.toLowerCase().indexOf(q) !== -1; });
                    if (!matchName && !matchDesc && !matchSpec && !matchCourse) return false;
                }
                return true;
            });
            if (state.activeSort === '最多课程') {
                result.sort(function(a, b) { return b.coursesCount - a.coursesCount; });
            } else if (state.activeSort === '最多浏览') {
                result.sort(function(a, b) { return b.viewsCount - a.viewsCount; });
            } else if (state.activeSort === '使用最多') {
                result.sort(function(a, b) { return b.durationMinutes - a.durationMinutes; });
            }
            return result;
        }

        /* ===== 启动模拟环境 ===== */
        function startSimulatedEnvironment(id, name) {
            state.bootStates[id] = { status: '启动中', progress: 10, outputLog: [
                '[SYSTEM] 正在请求分配物理节点资源...',
                '[DOCKER] 初始化 ' + id + ' 虚拟机沙盘上下文镜像...'
            ]};
            render();

            var stages = [
                { p: 25, log: '[SYSTEM] 沙盒内核挂载完成，正在配置轻量级端口转发...' },
                { p: 50, log: '[NETWORK] 绑定本地服务端口，打通边缘总线连接...' },
                { p: 75, log: '[DOCKER] 正在挂接物联网组件、测试脚本底座...' },
                { p: 100, log: '[OK] 实验软件模块服务启动完毕！您可以进入交互控制台。' }
            ];
            var currentStage = 0;
            var interval = setInterval(function() {
                if (currentStage < stages.length) {
                    var target = stages[currentStage];
                    state.bootStates[id] = {
                        status: target.p === 100 ? '运行中' : '启动中',
                        progress: target.p,
                        outputLog: state.bootStates[id].outputLog.concat([target.log])
                    };
                    render();
                    currentStage++;
                } else {
                    clearInterval(interval);
                    showToast(name + ' 容器环境已成功部署并开始运行。');
                }
            }, 400);
        }

        function resetSimulatedEnvironment(id) {
            delete state.bootStates[id];
            render();
            showToast('容器节点已释放，状态已重置。');
        }

        /* ===== 获取选中的 lab ===== */
        function getSelectedLab() {
            if (!state.selectedLabId) return null;
            return LAB_ENVIRONMENTS.find(function(l){ return l.id === state.selectedLabId; }) || null;
        }

        function getDetailsLab() {
            if (!state.detailsLabId) return null;
            return LAB_ENVIRONMENTS.find(function(l){ return l.id === state.detailsLabId; }) || null;
        }

        /* ===== 主渲染 ===== */

                root.innerHTML = renderDetailsPage();
            } else {
                root.innerHTML = renderListView();
            }

        }

                var lab = getSelectedLab();

        /* ===== 筛选行 ===== */

            options.forEach(function(opt) {
                html += '<button class="filter-btn' + (state[stateKey] === opt ? ' active' : '') + '" data-filter="' + stateKey + '" data-value="' + opt + '">' + opt + '</button>';
            });
            html += '</div>';
            html += '</div>';
            return html;
        }

        function renderSidebar(lab) {

            html += '<div class="details-card">';
            html += '<div class="details-card-header"><h3>📚 关联课程体系</h3>';
            html += '<span class="details-card-count">' + lab.courseList.length + ' 门课程</span>';
            html += '</div>';
            html += '<div class="details-card-body">';
            if (lab.courseList.length === 0) {
                html += '<div class="details-empty">该环境暂未关联课程体系</div>';
            } else {
                html += '<table class="course-table">';
                html += '<thead><tr><th>#</th><th>课程名称</th><th>课程类型</th><th>匹配度</th><th>学习人数</th><th>建议学时</th><th>难度</th></tr></thead>';
                html += '<tbody>';
                lab.courseList.forEach(function(c, idx) {
                    var cd = getCourseDetails(c, idx);
                    html += '<tr>';
                    html += '<td>' + (idx + 1) + '</td>';
                    html += '<td class="course-name-cell">' + cd.name + '</td>';
                    html += '<td>' + cd.type + '</td>';
                    html += '<td><span class="match-badge">' + cd.matchDegree + '</span></td>';
                    html += '<td>' + cd.enrolledCount + '</td>';
                    html += '<td>' + cd.suggestedHours + '</td>';
                    html += '<td><span class="difficulty-badge">' + cd.difficulty + '</span></td>';
                    html += '</tr>';
                });
                html += '</tbody></table>';
            }
            html += '</div>';
            html += '</div>';

            html += '</div>';

            /* 右列 */
            html += '<div class="details-page-right">';

            /* 统计卡片 */
            html += '<div class="details-card">';
            html += '<div class="details-card-header"><h3>📊 实验统计</h3></div>';
            html += '<div class="details-card-body">';
            html += '<div class="stat-metric-grid">';
            html += '<div class="stat-metric-box">';
            html += '<div class="metric-value">' + lab.coursesCount + '</div>';
            html += '<div class="metric-label">关联课程</div>';
            html += '</div>';
            html += '<div class="stat-metric-box">';
            html += '<div class="metric-value">' + lab.viewsCount + '</div>';
            html += '<div class="metric-label">浏览人数</div>';
            html += '</div>';
            html += '<div class="stat-metric-box">';
            html += '<div class="metric-value">' + lab.durationStr + '</div>';
            html += '<div class="metric-label">总时长</div>';
            html += '</div>';
            html += '<div class="stat-metric-box">';
            html += '<div class="metric-value">' + lab.specialties.length + '</div>';
            html += '<div class="metric-label">关联专业</div>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
            html += '</div>';

            /* 装载/控制面板 */
            html += '<div class="details-card">';
            html += '<div class="details-card-header"><h3>🖥 装载与控制</h3></div>';
            html += '<div class="details-card-body">';
            if (lab.directUse) {
                html += '<div class="boot-success-msg"><div class="dot"></div><span>直接使用型环境 — 无需容器启动</span></div>';
                html += '<button class="btn-launch full" data-action="launch-direct" data-lab-id="' + lab.id + '">▶ 打开仿真控制台</button>';
            } else {
                if (bootState && bootState.status === '运行中') {
                    html += '<div class="boot-success-msg"><div class="dot"></div><span>虚拟机节点挂载完成：运行网络IP 172.18.0.4</span></div>';
                    html += '<div class="console-power-row">';
                    html += '<button class="btn-console" data-action="open-console" data-lab-id="' + lab.id + '">🖥 进入控制台</button>';
                    html += '<button class="btn-power" data-action="reset-env" data-lab-id="' + lab.id + '">⏻ 释放</button>';
                    html += '</div>';
                } else if (bootState && bootState.status === '启动中') {
                    html += '<div class="boot-console-full">';
                    bootState.outputLog.forEach(function(log) {
                        html += '<div class="log-line"><span class="log-prefix">›</span>' + log + '</div>';
                    });
                    html += '</div>';
                    html += '<div class="boot-progress-bar"><div class="boot-progress-fill" style="width:' + bootState.progress + '%"></div></div>';
                    html += '<button class="btn-launch" disabled>🔄 容器初始化中... (' + bootState.progress + '%)</button>';
                } else {
                    html += '<div class="boot-idle-msg"><div class="dot gray"></div><span>环境未启动，点击下方按钮开始部署</span></div>';
                    html += '<button class="btn-launch full" data-action="start-env" data-lab-id="' + lab.id + '">▶ 启动虚拟实验环境</button>';
                }
            }
            html += '</div>';
            html += '</div>';

            html += '</div>';
            html += '</div>';

            return html;
        }

        /* ===== 事件绑定 ===== */
        function attachEvents() {
            /* 筛选按钮 */
            document.querySelectorAll('[data-filter]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var key = btn.getAttribute('data-filter');
                    var val = btn.getAttribute('data-value');
                    state[key] = val;
                    render();
                });
            });

            /* 排序标签 */
            document.querySelectorAll('[data-sort]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    state.activeSort = btn.getAttribute('data-sort');
                    render();
                });
            });

            /* 搜索输入 */
            var searchInput = document.getElementById('labSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    state.tempSearchQuery = searchInput.value;
                });
                searchInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        state.searchQuery = state.tempSearchQuery;
                        render();
                    }
                });
            }

            /* 筛选/重置按钮 */
            document.querySelectorAll('[data-action="query"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    state.searchQuery = state.tempSearchQuery;
                    render();
                });
            });
            document.querySelectorAll('[data-action="reset"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    state.filterCategory = '全部';
                    state.filterSpecialty = '全部';
                    state.filterSubCategory = '全部';
                    state.activeSort = '默认排序';
                    state.searchQuery = '';
                    state.tempSearchQuery = '';
                    render();
                });
            });
            document.querySelectorAll('[data-action="clear-filters"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    state.filterCategory = '全部';
                    state.filterSpecialty = '全部';
                    state.filterSubCategory = '全部';
                    state.searchQuery = '';
                    state.tempSearchQuery = '';
                    render();
                });
            });

            /* 卡片点击 → 选中显示 sidebar */
            document.querySelectorAll('.lab-card').forEach(function(card) {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.lab-card-experience-btn')) return;
                    var labId = card.getAttribute('data-lab-id');
                    if (state.selectedLabId === labId) {
                        state.selectedLabId = null;
                    } else {
                        state.selectedLabId = labId;
                    }
                    render();
                });
            });

            /* 体验按钮 → 直接进入对应实验环境 */
            document.querySelectorAll('[data-experience-id]').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var labId = btn.getAttribute('data-experience-id');
                    if (openLabEnvironment(labId)) return;
                    state.detailsLabId = labId;
                    state.view = 'details';
                    render();
                });
            });

            /* sidebar 关闭 */
            document.querySelectorAll('[data-action="close-sidebar"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    state.selectedLabId = null;
                    render();
                });
            });

            /* 课程列表折叠 */
            document.querySelectorAll('[data-action="toggle-courses"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    state.coursesListCollapsed = !state.coursesListCollapsed;
                    render();
                });
            });

            /* 启动环境 */
            document.querySelectorAll('[data-action="start-env"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var labId = btn.getAttribute('data-lab-id');
                    var lab = LAB_ENVIRONMENTS.find(function(l){ return l.id === labId; });
                    if (lab) startSimulatedEnvironment(labId, lab.name);
                });
            });

            /* 释放环境 */
            document.querySelectorAll('[data-action="reset-env"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    resetSimulatedEnvironment(btn.getAttribute('data-lab-id'));
                });
            });

            /* 打开控制台 / 直接打开 → 进入对应实验环境页面 */
            document.querySelectorAll('[data-action="open-console"], [data-action="launch-direct"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    openLabEnvironment(btn.getAttribute('data-lab-id'));
                });
            });

            /* 返回列表 */
            document.querySelectorAll('[data-action="back-to-list"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    state.view = 'list';
                    state.detailsLabId = null;
                    render();
                });
            });
        }

        /* ===== 初始化 ===== */
        render();
    </script>
    <script src="js/platform-shell.js"></script>
</body>
</html>
