<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试大厅 - 星朴XP-AI001人工智能算法训练平台</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* ========== ACL 安全访问横幅 ========== */
        .acl-banner {
            background: rgba(0, 212, 170, 0.06);
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: var(--radius-lg);
            padding: var(--space-2) var(--space-3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: var(--font-size-xs);
            color: var(--text-body);
            font-weight: var(--font-weight-medium);
            margin-bottom: var(--space-4);
        }
        .acl-banner-left {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        .acl-pulse {
            width: 8px;
            height: 8px;
            border-radius: var(--radius-full);
            background: var(--primary-green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .acl-label {
            color: var(--primary-green);
            font-weight: var(--font-weight-bold);
        }
        .acl-mono {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .acl-mono .secure {
            color: var(--primary-green);
            font-weight: var(--font-weight-bold);
        }

        /* ========== Hero Header 卡片 ========== */
        .hero-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
            flex-wrap: wrap;
        }
        .hero-left {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        .hero-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .hero-title {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: var(--text-title);
            margin-bottom: 4px;
        }
        .hero-subtitle {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        .hero-right {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        .compliance-badge {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: var(--primary-green);
            background: rgba(0, 212, 170, 0.08);
            border: 1px solid rgba(0, 212, 170, 0.2);
            padding: 6px 12px;
            border-radius: var(--radius-base);
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .compliance-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: var(--radius-full);
            background: var(--primary-green);
            animation: pulse 2s infinite;
        }

        /* ========== 指令提示行 ========== */
        .directive-tip {
            background: rgba(0, 212, 170, 0.04);
            border: 1px solid rgba(0, 212, 170, 0.15);
            border-radius: var(--radius-lg);
            padding: var(--space-3);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }
        .directive-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            background: rgba(0, 212, 170, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .directive-text {
            font-size: var(--font-size-sm);
            color: var(--text-body);
            font-weight: var(--font-weight-medium);
            line-height: 1.6;
        }
        .directive-text strong { font-weight: var(--font-weight-bold); }
        .directive-text .hl-green { color: var(--primary-green); }
        .directive-text .hl-blue { color: var(--primary-blue); }
        .directive-text .hl-purple { color: #a78bfa; }

        /* ========== 类型 Tab 选择器 ========== */
        .type-tab-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 6px;
            display: flex;
            gap: 4px;
            margin-bottom: var(--space-4);
            flex-wrap: wrap;
        }
        .type-tab {
            padding: 8px 16px;
            border-radius: var(--radius-base);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--duration-base) ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-family);
        }
        .type-tab:hover { background: var(--bg-input); color: var(--text-body); }
        .type-tab.active {
            background: var(--primary-blue);
            color: #fff;
            border-color: var(--primary-blue);
        }
        .type-tab .badge {
            font-size: 9px;
            padding: 1px 6px;
            border-radius: var(--radius-full);
            font-weight: var(--font-weight-bold);
            background: rgba(255, 255, 255, 0.15);
            color: inherit;
        }
        .type-tab:not(.active) .badge {
            background: var(--bg-input);
            color: var(--text-secondary);
        }

        /* ========== 主网格布局 ========== */
        .exam-main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--space-4);
            align-items: start;
        }

        /* ========== 左列：考试列表 ========== */
        .list-header {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
            flex-wrap: wrap;
        }
        .list-header-title {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            color: var(--text-title);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .list-header-title .icon { color: var(--primary-green); }
        .status-filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .status-btn {
            padding: 4px 12px;
            border-radius: var(--radius-base);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--duration-base) ease;
            font-family: var(--font-family);
        }
        .status-btn:hover { background: var(--bg-input); color: var(--text-body); }
        .status-btn.active {
            background: rgba(0, 212, 170, 0.08);
            color: var(--primary-green);
            border-color: rgba(0, 212, 170, 0.2);
        }

        /* ========== 考试卡片 ========== */
        .exam-list-container {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }
        .exam-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            transition: all var(--duration-base) ease;
        }
        .exam-card:hover {
            border-color: var(--primary-blue);
            box-shadow: var(--shadow-lg);
        }
        .exam-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-2);
            margin-bottom: var(--space-2);
        }
        .exam-card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .pill {
            font-size: 10px;
            font-weight: var(--font-weight-bold);
            padding: 2px 8px;
            border-radius: var(--radius-full);
            border: 1px solid transparent;
        }
        .pill.regular { background: rgba(0, 212, 170, 0.08); border-color: rgba(0, 212, 170, 0.2); color: var(--primary-green); }
        .pill.cert { background: rgba(0, 168, 255, 0.08); border-color: rgba(0, 168, 255, 0.2); color: var(--primary-blue); }
        .pill.contest { background: rgba(167, 139, 250, 0.08); border-color: rgba(167, 139, 250, 0.2); color: #a78bfa; }
        .pill.ongoing { background: var(--primary-green); color: #fff; }
        .pill.upcoming { background: rgba(245, 158, 11, 0.8); color: #fff; }
        .pill.ended { background: rgba(107, 114, 128, 0.3); color: var(--text-secondary); }
        .task-id {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            padding: 4px 8px;
            border-radius: var(--radius-base);
            flex-shrink: 0;
        }
        .exam-card-title {
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-bold);
            color: var(--text-title);
            margin-bottom: var(--space-2);
            transition: color var(--duration-base) ease;
        }
        .exam-card:hover .exam-card-title { color: var(--primary-blue); }
        .exam-card-desc {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: var(--space-2);
        }
        .exam-meta-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-2);
            border-top: 1px dashed var(--border-light);
            border-bottom: 1px dashed var(--border-light);
            padding: var(--space-2) 0;
            margin-bottom: var(--space-2);
        }
        .exam-meta-item {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Courier New', monospace;
            font-weight: var(--font-weight-medium);
        }
        .exam-meta-item .meta-icon { font-size: 14px; }
        .exam-meta-item.score { color: var(--primary-green); }
        .exam-meta-item.pass { color: rgba(245, 158, 11, 0.9); }
        .exam-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .anti-cheat-badge {
            font-size: var(--font-size-xs);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .anti-cheat-badge .icon { color: var(--primary-green); }
        .action-btn {
            padding: 6px 16px;
            border-radius: var(--radius-base);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            border: none;
            cursor: pointer;
            transition: all var(--duration-base) ease;
            font-family: var(--font-family);
            color: #fff;
        }
        .action-btn.ongoing { background: var(--primary-green); }
        .action-btn.ongoing:hover { background: #00b890; transform: translateY(-1px); }
        .action-btn.upcoming { background: rgba(245, 158, 11, 0.8); }
        .action-btn.upcoming:hover { background: rgba(245, 158, 11, 1); transform: translateY(-1px); }
        .action-btn.ended {
            background: var(--bg-input);
            color: var(--text-body);
            border: 1px solid var(--border-light);
        }
        .action-btn.ended:hover { background: var(--bg-panel); }

        /* ========== 空状态 ========== */
        .empty-state {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-6) var(--space-4);
            text-align: center;
        }
        .empty-state .icon { font-size: 40px; color: var(--text-secondary); margin-bottom: var(--space-2); }
        .empty-state p { font-size: var(--font-size-sm); color: var(--text-secondary); margin-bottom: var(--space-3); }
        .empty-state .reset-btn {
            padding: 6px 16px;
            background: var(--primary-blue);
            color: #fff;
            border: none;
            border-radius: var(--radius-base);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            font-family: var(--font-family);
        }

        /* ========== 右列：信息面板 ========== */
        .info-panel { display: flex; flex-direction: column; gap: var(--space-4); }
        .info-module {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
        }
        .info-module-title {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            color: var(--text-title);
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: var(--space-2);
            margin-bottom: var(--space-3);
        }
        .info-module-title .icon { color: var(--primary-green); }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-2);
        }
        .stat-item {
            border-radius: var(--radius-base);
            padding: var(--space-2) var(--space-3);
            text-align: center;
        }
        .stat-item.green { background: rgba(0, 212, 170, 0.06); border: 1px solid rgba(0, 212, 170, 0.15); }
        .stat-item.blue { background: rgba(0, 168, 255, 0.06); border: 1px solid rgba(0, 168, 255, 0.15); }
        .stat-item.purple { background: rgba(167, 139, 250, 0.06); border: 1px solid rgba(167, 139, 250, 0.15); }
        .stat-item.amber { background: rgba(245, 158, 11, 0.06); border: 1px solid rgba(245, 158, 11, 0.15); }
        .stat-item .label {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }
        .stat-item .value {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            font-family: 'Courier New', monospace;
        }
        .stat-item.green .value { color: var(--primary-green); }
        .stat-item.blue .value { color: var(--primary-blue); }
        .stat-item.purple .value { color: #a78bfa; }
        .stat-item.amber .value { color: rgba(245, 158, 11, 0.9); }

        .reminder-item {
            padding: var(--space-3);
            border-radius: var(--radius-base);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
        }
        .reminder-item.today { background: var(--bg-input); border: 1px solid var(--border-light); color: var(--text-secondary); }
        .reminder-item.nearest { background: rgba(0, 212, 170, 0.04); border: 1px solid rgba(0, 212, 170, 0.15); }
        .reminder-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            margin-bottom: 4px;
        }
        .reminder-meta .tag { color: var(--primary-green); }
        .reminder-item.nearest .exam-name { color: var(--text-title); font-weight: var(--font-weight-bold); font-size: var(--font-size-sm); margin-bottom: 4px; }
        .reminder-item.nearest .exam-time { display: flex; justify-content: space-between; font-family: 'Courier New', monospace; font-size: 9px; color: var(--text-secondary); }

        .info-module.dark { background: var(--bg-panel); border-color: var(--border-light); }
        .info-module.dark .info-module-title { color: var(--primary-green); }
        .info-module.dark ul { list-style: disc; padding-left: var(--space-4); }
        .info-module.dark li {
            font-size: var(--font-size-xs);
            color: var(--text-body);
            font-weight: var(--font-weight-medium);
            line-height: 1.8;
            margin-bottom: var(--space-1);
        }
        .info-module.dark li strong { color: var(--text-title); font-weight: var(--font-weight-bold); }

        /* ========== 考试作答视图 ========== */
        .exam-cockpit {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }
        .cockpit-header {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            padding: var(--space-3) var(--space-4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-2);
            flex-wrap: wrap;
        }
        .cockpit-header-left .mono-label {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .cockpit-header-left .mono-label .tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 1px 6px;
            border-radius: var(--radius-base);
            margin-right: 6px;
        }
        .cockpit-header-left h3 { font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); color: #fff; }
        .cockpit-back-btn {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            border-radius: var(--radius-base);
            cursor: pointer;
            transition: all var(--duration-base) ease;
            font-family: var(--font-family);
        }
        .cockpit-back-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .anti-cheat-bar {
            display: flex;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-panel);
        }
        .anti-cheat-bar .cell {
            flex: 1;
            padding: var(--space-2) var(--space-3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-light);
            text-align: center;
        }
        .anti-cheat-bar .cell:last-child { border-right: none; }
        .anti-cheat-bar .cell .label { font-size: 10px; color: var(--text-secondary); margin-bottom: 4px; }
        .anti-cheat-bar .cell .value {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            color: var(--text-title);
            font-family: 'Courier New', monospace;
        }
        .anti-cheat-bar .cell .value.green { color: var(--primary-green); }
        .anti-cheat-bar .cell .value.amber { color: rgba(245, 158, 11, 0.9); }
        .anti-cheat-bar .cell .value.red { color: #ef4444; }

        .cockpit-body { padding: var(--space-5); flex: 1; overflow-y: auto; }

        .pre-exam-card { max-width: 560px; margin: 0 auto; }
        .pre-exam-title { text-align: center; margin-bottom: var(--space-4); }
        .pre-exam-title h2 { font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); color: var(--text-title); margin-bottom: var(--space-1); }
        .pre-exam-title p { font-size: var(--font-size-sm); color: var(--text-secondary); }
        .exam-info-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
        }
        .exam-info-row {
            display: flex;
            justify-content: space-between;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--text-secondary);
            padding: 4px 0;
        }
        .exam-info-row .val { color: var(--text-title); font-weight: var(--font-weight-bold); }
        .exam-info-row .val.green { color: var(--primary-green); }
        .exam-info-row .val.red { color: #ef4444; }
        .exam-info-divider { border-top: 1px dashed var(--border-light); margin: var(--space-1) 0; }
        .anti-cheat-warn {
            background: rgba(245, 158, 11, 0.06);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: var(--radius-lg);
            padding: var(--space-3);
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
        }
        .anti-cheat-warn .icon { color: rgba(245, 158, 11, 0.9); font-size: 18px; flex-shrink: 0; margin-top: 2px; }
        .anti-cheat-warn p { font-size: var(--font-size-xs); color: var(--text-body); font-weight: var(--font-weight-medium); line-height: 1.6; }
        .anti-cheat-warn strong { color: rgba(245, 158, 11, 0.9); font-weight: var(--font-weight-bold); }
        .start-exam-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-green);
            color: #fff;
            border: none;
            border-radius: var(--radius-lg);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all var(--duration-base) ease;
            font-family: var(--font-family);
        }
        .start-exam-btn:hover { background: #00b890; transform: translateY(-1px); }
        .start-exam-btn:disabled { background: var(--bg-input); color: var(--text-secondary); cursor: not-allowed; transform: none; }

        .quiz-area { max-width: 800px; margin: 0 auto; }
        .quiz-progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: var(--font-weight-bold);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: var(--space-2);
            margin-bottom: var(--space-3);
        }
        .quiz-progress-bar .progress { color: var(--primary-green); }
        .quiz-progress-bar .score { color: #ef4444; }
        .quiz-progress-bar .timer { color: var(--text-secondary); }
        .question-card {

        var state = {

        function formatTime(seconds) {
            var h = Math.floor(seconds / 3600);
            var m = Math.floor((seconds % 3600) / 60);
            var s = seconds % 60;
            return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');

        function getFilteredTasks() {
            return EXAM_TASKS.filter(function(item) {
                var matchType = state.activeTypeTab === 'all' || item.type === state.activeTypeTab;
                var matchStatus = state.activeStatusTab === 'all' || item.status === state.activeStatusTab;
                return matchType && matchStatus;
            });
        }

        function renderListView() {
            var container = document.getElementById('examContent');
            var filtered = getFilteredTasks();

            var statusBtns = [
                {status:'all',label:'全部'},
                {status:'upcoming',label:'即将开始'},

                {status:'ended',label:'已结束'}
            ];
            var html = '';

            html += '<div class="hero-card"><div class="hero-left"><div class="hero-icon">&#128221;</div><div><div class="hero-title">考试大厅</div><div class="hero-subtitle">支持常规考试、认证测评、竞赛等多类型考试任务统一管理与参与。</div></div></div><div class="hero-right"><div class="compliance-badge"><span class="dot"></span>EXAM_STANDARDS: COMPLIANT</div></div></div>';

            html += '<div class="type-tab-bar">';

            html += '</div>';

            html += '<div class="exam-cockpit">';

            html += '<div class="cockpit-header"><div class="cockpit-header-left"><div class="mono-label"><span class="tag">EXAM_LIVE_COCKPIT</span>1+X NLE-EXAM ONLINE AGENT</div><h3>当前试卷：' + (task?task.title:'') + '</h3></div><button class="cockpit-back-btn" id="backToList">&larr; 退出考场 返回大厅</button></div>';

            var statusColor = state.studentExamStatus === '考试中' ? 'green' : state.studentExamStatus === '预警' ? 'amber' : (state.studentExamStatus === '异常' || state.studentExamStatus === '已超时') ? 'red' : 'green';
            var timerClass = state.examTimer < 600 ? 'red' : '';
            var switchClass = state.switchCount >= MAX_SWITCH ? 'red' : '';
            var anomalyClass = state.copyPasteAnomalies > 0 ? 'amber' : '';

            html += '<div class="anti-cheat-bar"><div class="cell"><span class="label">考试状态</span><span class="value ' + statusColor + '">' + state.studentExamStatus + '</span></div><div class="cell"><span class="label">剩余时间</span><span class="value ' + timerClass + '">' + formatTime(state.examTimer) + '</span></div><div class="cell"><span class="label">切屏次数</span><span class="value ' + switchClass + '">' + state.switchCount + ' / ' + MAX_SWITCH + '</span></div><div class="cell"><span class="label">复制粘贴限制</span><span class="value green">已开启</span></div><div class="cell"><span class="label">异常行为</span><span class="value ' + anomalyClass + '">' + state.copyPasteAnomalies + ' 条</span></div><div class="cell"><span class="label">限考/已用</span><span class="value">1 / ' + state.usedAttempts + '</span></div></div>';

            html += '<div class="cockpit-body">';
            if (!state.examStarted) html += renderPreExam(task);
            else if (!state.isExamSubmitted) html += renderQuiz();
            else html += renderResult();
            html += '</div>';

            html += '<div class="cockpit-footer">智慧教育综合实训平台 统考安全终端 &copy; 2026 同步安全环境已激活</div></div>';

            container.innerHTML = html;
            bindCockpitEvents();
        }

        function renderPreExam(task) {
            var html = '';
            html += '<div class="pre-exam-card"><div class="pre-exam-title"><h2>考试作答</h2><p>请仔细阅读考试规则并确认环境准备完毕后进入考场。</p></div>';
            html += '<div class="exam-info-card"><div class="exam-info-row"><span>考试名称：</span><span class="val">' + (task?task.title:'') + '</span></div><div class="exam-info-row"><span>考试场次：</span><span class="val">第一场</span></div><div class="exam-info-row"><span>考试时间：</span><span class="val">2026-06-10 09:00 - 11:00</span></div><div class="exam-info-row"><span>考试时长：</span><span class="val">120 分钟</span></div><div class="exam-info-row"><span>限考次数：</span><span class="val">1 次</span></div><div class="exam-info-divider"></div><div class="exam-info-row"><span>剩余次数：</span><span class="val">' + (1 - state.usedAttempts) + ' 次</span></div>';
            var statusText = state.usedAttempts >= 1 ? '不可再次进入' : '可进入考试';
            var statusClass = state.usedAttempts >= 1 ? 'red' : 'green';
            html += '<div class="exam-info-row"><span>考试状态：</span><span class="val ' + statusClass + '">' + statusText + '</span></div></div>';
            html += '<div class="anti-cheat-warn"><span class="icon">&#128737;</span><div><p>本场考试已开启防作弊规则：<strong>禁止屏幕切换、禁止复制粘贴、禁止右键菜单。</strong></p><p>违规操作将被实时记录至智能评测大盘。</p></div></div>';
            html += '<button class="start-exam-btn" id="startExamBtn"' + (state.usedAttempts >= 1 ? ' disabled' : '') + '>我已知晓，开始考试</button></div>';
            return html;
        }

        function renderQuiz() {
            var q = EXAM_QUESTIONS[state.currentQuestionIdx];
            var html = '';
            html += '<div class="quiz-area">';
            html += '<div class="quiz-progress-bar"><span class="progress">答题进度: ' + (state.currentQuestionIdx + 1) + ' / ' + EXAM_QUESTIONS.length + '</span><span class="timer">剩余: ' + formatTime(state.examTimer) + '</span><span class="score">当前分值: 100分</span></div>';
            html += '<div class="question-card"><p class="question-text">' + q.id + '. ' + q.question + '</p></div>';
            html += '<div class="option-list">';
            q.options.forEach(function(opt, idx) {
                var selected = state.answers[state.currentQuestionIdx] === idx;
                html += '<button class="option-item' + (selected?' selected':'') + '" data-option="' + idx + '"><span class="option-letter">' + String.fromCharCode(65 + idx) + '</span><span>' + opt + '</span></button>';
            });
            html += '</div>';
            html += '<div class="quiz-nav"><button class="quiz-nav-btn prev" id="prevBtn"' + (state.currentQuestionIdx === 0 ? ' disabled' : '') + '>&larr; 上一题</button><div class="quiz-dots">';
            EXAM_QUESTIONS.forEach(function(_, i) { html += '<span class="dot' + (i === state.currentQuestionIdx ? ' active' : '') + '"></span>'; });
            html += '</div>';
            if (state.currentQuestionIdx < EXAM_QUESTIONS.length - 1) html += '<button class="quiz-nav-btn next" id="nextBtn">下一题 &rarr;</button>';
            else html += '<button class="quiz-nav-btn next" id="submitBtn">提交作答</button>';
            html += '</div></div>';
            return html;
        }

        function renderResult() {
            var html = '';
            html += '<div class="result-area">';
            html += '<div class="score-circle"><div class="inner"><span class="score-num">' + state.examScore + '</span><span class="score-label">PTS</span></div></div>';
            html += '<h4 class="result-title">' + (state.examScore >= 60 ? '&#127942; 提交成功，及格通过！' : '&#9888; 评测未达及格线') + '</h4>';
            html += '<p class="result-desc">本套统判分数已成功备案归档至平台云端教考系统数据库。</p>';
            html += '<div class="diagnostic-report"><div class="report-title"><span>&#128204;</span>【诊断评价报告】</div>';
            EXAM_QUESTIONS.forEach(function(q, idx) {
                var isCorrect = state.answers[idx] === q.correct;
                var userAns = state.answers[idx] !== undefined ? String.fromCharCode(65 + state.answers[idx]) : '未填';
                html += '<div class="diagnostic-item"><p class="q">' + (idx + 1) + '. ' + q.question + '</p><div class="ans"><span class="' + (isCorrect ? 'correct' : 'wrong') + '">您的选择: 选项 ' + userAns + '</span><span class="ref">正确参考: 选项 ' + String.fromCharCode(65 + q.correct) + '</span></div><p class="exp">解析: ' + q.explanation + '</p></div>';
            });
            html += '</div>';
            html += '<div class="result-actions"><button class="btn-retry" id="retryBtn">&#128260; 重新挑战本题</button><button class="btn-back" id="backFromResult">返回考试大厅 &rarr;</button></div>';
            html += '</div>';
            return html;
        }

        function bindCockpitEvents() {
            var backBtn = document.getElementById('backToList');
            if (backBtn) backBtn.addEventListener('click', function() {
                if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
                state.selectedExamId = null;
                showToast('已成功返回考试大厅');
                renderListView();
            });

            var startBtn = document.getElementById('startExamBtn');
            if (startBtn) startBtn.addEventListener('click', function() {
                state.examStarted = true;
                state.usedAttempts = 1;
                var task = EXAM_TASKS.find(function(e) { return e.id === state.selectedExamId; });
                showToast('《' + (task?task.title:'') + '》考位下载就绪，倒计时已启动。');
                startTimer();
                renderCockpitView();
            });

            document.querySelectorAll('[data-option]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var idx = parseInt(this.dataset.option);
                    state.answers[state.currentQuestionIdx] = idx;
                    renderCockpitView();
                });
            });

            var prevBtn = document.getElementById('prevBtn');
            if (prevBtn) prevBtn.addEventListener('click', function() {
                if (state.currentQuestionIdx > 0) { state.currentQuestionIdx--; renderCockpitView(); }
            });

            var nextBtn = document.getElementById('nextBtn');
            if (nextBtn) nextBtn.addEventListener('click', function() {
                if (state.answers[state.currentQuestionIdx] === undefined) { showToast('请至少勾选一个选项。'); return; }
                state.currentQuestionIdx++;
                renderCockpitView();
            });

            var submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.addEventListener('click', function() {
                if (state.answers[state.currentQuestionIdx] === undefined) { showToast('请确认完成最后一题的答案采集。'); return; }
                calculateScore();
            });

            var retryBtn = document.getElementById('retryBtn');
            if (retryBtn) retryBtn.addEventListener('click', function() {
                state.answers = {}; state.currentQuestionIdx = 0;
                state.isExamSubmitted = false; state.examScore = 0;
                renderCockpitView();
            });

            var backFromResult = document.getElementById('backFromResult');
            if (backFromResult) backFromResult.addEventListener('click', function() {
                if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
                state.selectedExamId = null;
                showToast('状态已保存，返回考试大厅');
                renderListView();
            });

            // 防作弊：禁止复制粘贴右键
            var cockpitBody = document.querySelector('.cockpit-body');
            if (cockpitBody && state.examStarted && !state.isExamSubmitted) {
                cockpitBody.addEventListener('copy', function(e) { e.preventDefault(); state.copyPasteAnomalies++; showToast('本场考试已禁止复制操作。'); renderCockpitView(); });
                cockpitBody.addEventListener('paste', function(e) { e.preventDefault(); state.copyPasteAnomalies++; showToast('本场考试已禁止粘贴操作。'); renderCockpitView(); });
                cockpitBody.addEventListener('contextmenu', function(e) { e.preventDefault(); state.copyPasteAnomalies++; showToast('本场考试已禁止右键菜单。'); renderCockpitView(); });
            }
        }

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(function() {
                if (state.examTimer <= 1) {
                    state.examTimer = 0;
                    state.studentExamStatus = "已超时";
                    state.isExamSubmitted = true;
                    calculateScore();
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                    return;
                }
                state.examTimer--;
                // 仅更新计时器显示，不重新渲染整个视图
                var timerCell = document.querySelector('.anti-cheat-bar .cell:nth-child(2) .value');
                if (timerCell) {
                    timerCell.textContent = formatTime(state.examTimer);
                    if (state.examTimer < 600) timerCell.classList.add('red');
                }
            }, 1000);
        }

        // 切屏检测
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden' && state.examStarted && !state.isExamSubmitted) {
                state.switchCount++;
                if (state.switchCount > MAX_SWITCH) {
                    state.studentExamStatus = "异常";
                    showToast('切屏次数已超过限制，考试状态已标记为异常。');
                } else {
                    showToast('检测到屏幕切换行为，当前切屏次数：' + state.switchCount + ' / ' + MAX_SWITCH + '。');
                }
                renderCockpitView();
            }
        });

        function calculateScore() {
            var score = 0;
            EXAM_QUESTIONS.forEach(function(q, idx) {
                if (state.answers[idx] === q.correct) score += 50;
            });
            state.examScore = score;
            state.isExamSubmitted = true;
            if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
            showToast('作答完成！考试得分: ' + score + '分');
            renderCockpitView();
        }

        // 初始化
        renderListView();
    </script>
    <script src="js/platform-shell.js"></script>
</body>
</html>
