<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 人工智能算法训练平台</title>
    
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="css/common.css">
    
    <style>
        /* 个人中心页面特定样式 */
        .page-header-section {
            margin-bottom: var(--space-4);
        }

        .page-main-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-semibold);
            color: var(--text-title);
            margin-bottom: var(--space-2);
        }

        .page-main-subtitle {
            font-size: var(--font-size-base);
            color: var(--text-secondary);
        }

        /* 用户信息卡片 */
        .user-profile-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            box-shadow: var(--shadow-card);
            display: flex;
            gap: var(--space-3);
            align-items: center;
            margin-bottom: var(--space-4);
            border: 1px solid var(--border-light);
        }

        .user-avatar-large {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-hover));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            flex-shrink: 0;
        }

        .user-info-details {
            flex: 1;
        }

        .user-name-large {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-semibold);
            color: var(--text-title);
            margin-bottom: var(--space-2);
        }

        .user-meta-list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }

        .user-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-role-badge {
            padding: 4px var(--space-2);
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
        }

        /* 表单区域 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }

        .form-section-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }

        .form-section-title {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--text-title);
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .form-section-icon {
            font-size: 18px;
        }

        .form-group {
            margin-bottom: var(--space-3);
        }

        .form-group:last-of-type {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--text-title);
            margin-bottom: var(--space-1);
        }

        .form-input {
            width: 100%;
            padding: var(--space-2);
            border: 1px solid var(--border-base);
            border-radius: var(--radius-base);
            font-size: var(--font-size-base);
            font-family: var(--font-family);
            transition: all var(--duration-base) ease;
            background: var(--bg-card);
            color: var(--text-body);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: var(--shadow-input-focus);
        }

        .form-input:disabled {
            background: var(--bg-body);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            gap: var(--space-2);
            justify-content: flex-end;
            margin-top: var(--space-3);
            padding-top: var(--space-3);
            border-top: 1px solid var(--border-light);
        }

        .btn-form {
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-base);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--duration-base) ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            font-family: var(--font-family);
        }

        .btn-form-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-form-primary:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
        }

        .btn-form-secondary {
            background: var(--bg-body);
            color: var(--text-body);
            border: 1px solid var(--border-base);
        }

        .btn-form-secondary:hover {
            background: var(--border-light);
        }

        /* 用户信息 */
        .user-info {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-hover));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-sm);
        }

        .user-details {
            text-align: right;
        }

        .user-name {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
        }

        .user-meta {
            font-size: var(--font-size-xs);
            opacity: 0.8;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .user-profile-card {
                flex-direction: column;
                text-align: center;
            }
            
            .user-meta-list {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .user-meta-list {
                flex-direction: column;
                gap: var(--space-1);
            }
        }
    </style>
    <link rel="stylesheet" href="css/platform-theme.css">
</head>
<body data-platform-page="profile" data-platform-shell="standard">
    <!-- 顶部导航栏 -->
    <header class="top-nav">
        <div class="nav-brand">
            <div class="nav-brand-icon">E</div>
            <span class="nav-brand-text">人工智能算法训练平台</span>
        </div>
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-link">首页</a>
            <a href="experiment-hall.html" class="nav-link">实验大厅</a>
            <a href="exam-hall.html" class="nav-link">考试中心</a>
            <a href="profile.html" class="nav-link active">个人中心</a>
        </div>
        <div class="user-info">
            <div class="user-details">
                <div class="user-name">魏同学</div>
                <div class="user-meta">2024级 计算机学院</div>
            </div>
            <div class="user-avatar">魏</div>
        </div>
    </header>

    <!-- 应用布局 -->
    <div class="app-layout">
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-item" data-page="dashboard">
                    <span class="sidebar-icon">📊</span>
                    我的工作台
                </a>
                <a href="ai-assistant.html" class="sidebar-item" data-page="ai-assistant">
                    <span class="sidebar-icon">🤖</span>
                    AI学习助手
                </a>
                <a href="experiment-hall.html" class="sidebar-item" data-page="experiment-hall">
                    <span class="sidebar-icon">🔬</span>
                    实验大厅
                </a>
                <a href="experiment-detail.html" class="sidebar-item" data-page="simulation">
                    <span class="sidebar-icon">💻</span>
                    虚拟仿真实验
                </a>
                <a href="experiment-detail.html" class="sidebar-item" data-page="research">
                    <span class="sidebar-icon">☁️</span>
                    科研云服务
                </a>
                <a href="experiment-detail.html" class="sidebar-item" data-page="design">
                    <span class="sidebar-icon">🎨</span>
                    创意设计
                </a>
                <a href="experiment-detail.html" class="sidebar-item" data-page="embedded">
                    <span class="sidebar-icon">🔧</span>
                    嵌入式实训
                </a>
                <a href="experiment-detail.html" class="sidebar-item" data-page="algorithm">
                    <span class="sidebar-icon">⚙️</span>
                    算法演练
                </a>
                <a href="exam-hall.html" class="sidebar-item" data-page="exam-hall">
                    <span class="sidebar-icon">📝</span>
                    考场大厅
                </a>
                <a href="profile.html" class="sidebar-item active" data-page="profile">
                    <span class="sidebar-icon">👤</span>
                    个人中心
                </a>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 页面标题 -->
            <section class="page-header-section">
                <h1 class="page-main-title">👤 个人中心</h1>
                <p class="page-main-subtitle">管理您的个人信息和账户安全</p>
            </section>

            <!-- 用户信息展示 -->
            <section class="user-profile-card">
                <div class="user-avatar-large">魏</div>
                <div class="user-info-details">
                    <h2 class="user-name-large">魏同学</h2>
                    <div class="user-meta-list">
                        <div class="user-meta-item">
                            <span class="user-role-badge">学生</span>
                        </div>
                        <div class="user-meta-item">
                            <span>📧</span>
                            <span>学号：2024001001</span>
                        </div>
                        <div class="user-meta-item">
                            <span>🏫</span>
                            <span>计算机科学与技术学院</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 表单区域 -->
            <div class="form-grid">
                <!-- 信息修改表单 -->
                <section class="form-section-card">
                    <h3 class="form-section-title">
                        <span class="form-section-icon">📝</span>
                        基本信息
                    </h3>
                    <form id="profileForm">
                        <div class="form-group">
                            <label class="form-label" for="name">姓名</label>
                            <input type="text" id="name" class="form-input" value="魏同学" placeholder="请输入姓名">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">邮箱</label>
                            <input type="email" id="email" class="form-input" value="zhangstudent@university.edu.cn" placeholder="请输入邮箱">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phone">手机号</label>
                            <input type="tel" id="phone" class="form-input" value="138****8888" placeholder="请输入手机号">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="college">学院</label>
                            <input type="text" id="college" class="form-input" value="计算机科学与技术学院" placeholder="请输入学院">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="major">专业</label>
                            <input type="text" id="major" class="form-input" value="计算机科学与技术" placeholder="请输入专业">
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-form btn-form-secondary" onclick="resetProfileForm()">重置</button>
                            <button type="submit" class="btn-form btn-form-primary">保存修改</button>
                        </div>
                    </form>
                </section>

                <!-- 密码修改表单 -->
                <section class="form-section-card">
                    <h3 class="form-section-title">
                        <span class="form-section-icon">🔐</span>
                        修改密码
                    </h3>
                    <form id="passwordForm">
                        <div class="form-group">
                            <label class="form-label" for="oldPassword">旧密码</label>
                            <input type="password" id="oldPassword" class="form-input" placeholder="请输入旧密码">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="newPassword">新密码</label>
                            <input type="password" id="newPassword" class="form-input" placeholder="请输入新密码">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="confirmPassword">确认密码</label>
                            <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入新密码">
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-form btn-form-secondary" onclick="resetPasswordForm()">重置</button>
                            <button type="submit" class="btn-form btn-form-primary">修改密码</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <!-- 引入JavaScript文件 -->
    <script src="js/app.js"></script>
    <script>
        // 基本信息表单提交
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('个人信息保存成功！');
        });

        // 密码修改表单提交
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('两次输入的密码不一致，请重新输入！');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('密码长度不能少于6位！');
                return;
            }
            
            alert('密码修改成功！');
            this.reset();
        });

        // 重置基本信息表单
        function resetProfileForm() {
            document.getElementById('profileForm').reset();
        }

        // 重置密码表单
        function resetPasswordForm() {
            document.getElementById('passwordForm').reset();
        }
    </script>
    <script src="js/platform-shell.js"></script>
</body>
</html>
